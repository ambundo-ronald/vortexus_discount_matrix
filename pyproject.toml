[project]
name = "vortexus_discount_matrix"
version = "0.3.0"
description = "Group-based discount ceilings and manager exceptions for ERPNext v16"
authors = [{name = "Vortexus Industrial Solutions Limited"}]
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.sdist]
include = ["vortexus_discount_matrix/data/*.csv", "vortexus_discount_matrix/public/js/*.js"]
